  DEPEND_0: epoch
  DEPEND_1: priority
  DEPEND_2: event_num
  DICT_KEY: SPASE>Support>SupportQuantity:Other
  DISPLAY_TYPE: no_plot
  FIELDNAM: APD ID
  FILLVAL: *uint8_fillval
  FORMAT: I2
  LABL_PTR_1: priority_label
  LABL_PTR_2: event_num_label
  SCALETYP: linear
  UNITS: " "
  VALIDMAX: 31
  VALIDMIN: 0
  VAR_TYPE: data

position:
  CATDESC: Position Index
  DEPEND_0: epoch
  DEPEND_1: priority
  DEPEND_2: event_num
  DICT_KEY: SPASE>Support>SupportQuantity:Other
  DISPLAY_TYPE: no_plot
  FIELDNAM: Position
  FILLVAL: *uint8_fillval
  FORMAT: I2
