  DEPEND_0: epoch
  DEPEND_1: priority
  DEPEND_2: event_num
  DICT_KEY: SPASE>Particle>ParticleType:Ion,ParticleQuantity:ArrivalDirection,Qualifier:DirectionAngle.AzimuthAngle
  DISPLAY_TYPE: spectrogram
