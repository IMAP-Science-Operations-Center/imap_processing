# ----------------------------- Useful variables -----------------------------
uint8_fillval: &uint8_fillval 255
uint16_fillval: &uint16_fillval 65535
real_fillval: &real_fillval -1.0e+31
min_int: &min_int -9223372036854775808
max_int: &max_int 9223372036854775807
# ------------------------------- Coordinates -------------------------------
epoch:
  DELTA_MINUS_VAR: epoch_delta_minus
  DELTA_PLUS_VAR: epoch_delta_plus

priority:
  CATDESC: Direct-event telemetry priority level (0-7)
  DICT_KEY: SPASE>Support>SupportQuantity:Other
  FIELDNAM: Event Priority Level
  FILLVAL: *uint8_fillval
  FORMAT: I1
  LABLAXIS: Priority
  SCALETYP: linear
  UNITS: " "
  VALIDMAX: 7
  VALIDMIN: 0
  VAR_NOTES: >
    Lo direct-event telemetry priority level. 0 = SW TCR PUIs, 1 = SW H+, 2 =
    SW He++, 3 = SW Heavies, 4 = SW DCR PUIs, 5 = NSW Heavies, 6 = NSW H+ and
    He++, 7 = reserved/unused.
  VAR_TYPE: support_data

event_num:
  CATDESC: Event Number
  DICT_KEY: SPASE>Support>SupportQuantity:Other
  FIELDNAM: Event Number
  FILLVAL: *uint16_fillval
  FORMAT: I5
  LABLAXIS: Event Number
  SCALETYP: linear
  UNITS: " "
  VALIDMAX: 10000
  VALIDMIN: 0
  VAR_TYPE: support_data

epoch_delta_minus:
  CATDESC: Time from acquisition start to acquisition center
  DEPEND_0: epoch
  DICT_KEY: SPASE>Support>SupportQuantity:Temporal,Qualifier:Uncertainty
  FIELDNAM: epoch delta minus
  FILLVAL: -9223372036854775808
  FORMAT: I19
  LABLAXIS: Epoch Delta Minus
  SCALETYP: linear
  UNITS: ns
  VALIDMAX: 128000000000
  VALIDMIN: 0
  VAR_TYPE: support_data

epoch_delta_plus:
  CATDESC: Time from acquisition center to acquisition end
  DEPEND_0: epoch
  DICT_KEY: SPASE>Support>SupportQuantity:Temporal,Qualifier:Uncertainty
  FIELDNAM: epoch delta plus
  FILLVAL: -9223372036854775808
  FORMAT: I19
  LABLAXIS: Epoch Delta Plus
  SCALETYP: linear
  UNITS: ns
  VALIDMAX: 128000000000
  VALIDMIN: 0
  VAR_TYPE: support_data

# ------------------------------- Data Variables -------------------------------
num_events:
  CATDESC: Number of Events per Priority
  DEPEND_0: epoch
  DEPEND_1: priority
  DICT_KEY: SPASE>Support>SupportQuantity:Other
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Number of Events
  FILLVAL: *uint16_fillval
  FORMAT: I5
  LABLAXIS: Number of Events
  LABL_PTR_1: priority_label
  SCALETYP: linear
  UNITS: " "
  VALIDMAX: 10000
  VALIDMIN: 0
  VAR_TYPE: data
  LABLAXIS: Number of Events

data_quality:
  CATDESC: Data Quality Flag per Priority (0=good, 1=suspect)
  DEPEND_0: epoch
  DEPEND_1: priority
  DICT_KEY: SPASE>Support>SupportQuantity:DataQuality
  DISPLAY_TYPE: no_plot
  FIELDNAM: Data Quality Flag
  FILLVAL: *uint16_fillval
  FORMAT: I5
  LABL_PTR_1: priority_label
  SCALETYP: linear
  UNITS: 0=good
  VALIDMAX: 255
  VALIDMIN: 0
  VAR_NOTES: >
    Quality flag propagated from the packet-level suspect bit for each
    direct-event priority bin. 0 = good packet group. 1 = suspect packet
    group. 65535 = fill when no direct-event data are present for the priority
    bin.
  VAR_TYPE: data

energy_step:
  CATDESC: Energy Step Index
  DEPEND_0: epoch
  DEPEND_1: priority
  DEPEND_2: event_num
  DICT_KEY: SPASE>Support>SupportQuantity:Other
  DISPLAY_TYPE: no_plot
  FIELDNAM: Energy Step
  FILLVAL: *uint8_fillval
  FORMAT: I3
  LABL_PTR_1: priority_label
  LABL_PTR_2: event_num_label
  SCALETYP: linear
  UNITS: " "
  VALIDMAX: 127
  VALIDMIN: 0
  VAR_TYPE: data

energy_per_charge:
  CATDESC: Energy per Charge
  DEPEND_0: epoch
  DEPEND_1: priority
  DEPEND_2: event_num
  DICT_KEY: SPASE>Particle>ParticleType:Ion,ParticleQuantity:EnergyPerCharge
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Energy per Charge
  FILLVAL: *real_fillval
  FORMAT: F12.4
  LABL_PTR_1: priority_label
  LABL_PTR_2: event_num_label
  SCALETYP: linear
  UNITS: keV/q
  VALIDMAX: 200.0
  VALIDMIN: 0.0
  VAR_TYPE: data

apd_energy:
  CATDESC: APD Energy
  DEPEND_0: epoch
  DEPEND_1: priority
  DEPEND_2: event_num
  DICT_KEY: SPASE>Particle>ParticleType:Ion,ParticleQuantity:Energy
  DISPLAY_TYPE: spectrogram
  FIELDNAM: APD Energy
  FILLVAL: *real_fillval
  FORMAT: F12.4
  LABL_PTR_1: priority_label
  LABL_PTR_2: event_num_label
  SCALETYP: linear
  UNITS: keV
  VALIDMAX: 512.0
  VALIDMIN: 0.0
  VAR_TYPE: data

gain:
  CATDESC: Gain Setting
  DEPEND_0: epoch
  DEPEND_1: priority
  DEPEND_2: event_num
  DICT_KEY: SPASE>Support>SupportQuantity:Other
