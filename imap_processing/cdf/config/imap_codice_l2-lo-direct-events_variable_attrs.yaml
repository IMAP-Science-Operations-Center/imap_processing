  FILLVAL: *real_fillval
  FORMAT: F12.4
  LABL_PTR_1: priority_label
  LABL_PTR_2: event_num_label
  SCALETYP: linear
  UNITS: ns
  VALIDMAX: 1024.0
  VALIDMIN: 0.0
  VAR_TYPE: data

