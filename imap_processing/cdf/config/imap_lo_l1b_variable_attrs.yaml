default_attrs: &default
  # Assumed values for all variable attrs unless overwritten
  DEPEND_0: epoch
  DISPLAY_TYPE: time_series
  FILLVAL: -9223372036854775808
  FORMAT: F19.3
  UNITS: ' '
  VALIDMAX: 9223372036854775807
  VALIDMIN: 0
  VAR_TYPE: data

direction_vec_label:
  CATDESC: Directional vector for each direct event
  FIELDNAM: Direction Vector (X, Y, Z)
  FORMAT: A3
  VAR_TYPE: metadata

esa_step:
  <<: *default
  CATDESC: Energy Step
  DEPEND_0: epoch
  FIELDNAM: Energy Step
  FORMAT: I1
  LABLAXIS: ESA
  VALIDMAX: 7
  VALIDMIN: 1

mode:
  <<: *default
  CATDESC: Energy Stepping Mode. 0 = high-throughput, 1 = high-resolution
  FIELDNAM: ESA Mode
  FORMAT: I1
  LABLAXIS: ESA Mode
  VALIDMAX: 1
  VAR_TYPE: data

tof0:
  <<: *default
  CATDESC: Time of Flight
  FIELDNAM: Time of Flight 2
  FILLVAL: -1.0000000E+31
  LABLAXIS: ToF 0
  UNITS: ns

tof1:
  <<: *default
  CATDESC: Time of Flight
  FIELDNAM: Time of Flight 1
  FILLVAL: -1.0000000E+31
  LABLAXIS: ToF 1
  UNITS: ns

tof2:
  <<: *default
  CATDESC: Time of Flight
  FIELDNAM: Time of Flight 2
  FILLVAL: -1.0000000E+31
  LABLAXIS: ToF 2
  UNITS: ns

tof3:
  <<: *default
  CATDESC: Time of Flight
  FIELDNAM: Time of Flight 3
  FILLVAL: -1.0000000E+31
  LABLAXIS: ToF 3
  UNITS: ns

coincidence_type:
  <<: *default
  CATDESC: Coincidence type for the direct event
  FIELDNAM: Coincidence type
  FORMAT: I2
  LABLAXIS: coincidence type
  VALIDMAX: 14

pos:
  <<: *default
  CATDESC: Stop position
  FIELDNAM: Stop Position
  FORMAT: I1
  LABLAXIS: Stop Position
  VALIDMAX: 4

coincidence:
  <<: *default
  CATDESC: Species of Direct Event. 0=light, 1=heavy, 2=other
  FIELDNAM: Species
  FORMAT: I1
  LABLAXIS: Species
  VALIDMAX: 2

badtime:
  <<: *default
  CATDESC: Flag if DE measured in badtime 1 = yes, 2 = no
  FIELDNAM: Badtime Flag
  FORMAT: I1
  LABLAXIS: Badtime flag
  VALIDMAX: 2
  VALIDMIN: 1

direction_vec:
  CATDESC: Direction Vector Position (X, Y, Z)
  DEPEND_1: direction_vec
  FIELDNAM: Direction Vector Position
  FORMAT: I1
  LABLAXIS: (X, Y, Z)
  UNITS: ' '
  VALIDMAX: 2
  VALIDMIN: 0
  VAR_TYPE: support_data

direction:
  <<: *default
  CATDESC: Directional vector for each direct event
  DEPEND_1: direction_vec
  FIELDNAM: Direction
  FORMAT: I1
  LABLAXIS: Direction
  LABL_PTR_1: direction_vec_label
  VALIDMAX: 1

# Star Sensor L1B Attributes
met:
  <<: *default
  CATDESC: Start Mission Elapsed Time of averaging period
  FIELDNAM: MET
  FORMAT: I16
  VAR_TYPE: support_data

spin_angle:
  CATDESC: Spin angle in degrees
  FIELDNAM: Spin Angle
  FILLVAL: -1.0e31
  FORMAT: F8.3
  UNITS: deg
  VALIDMAX: 360.0
  VALIDMIN: 0.0
  VAR_TYPE: support_data

spin_angle_bin:
  <<: *default
  CATDESC: Original spin angle bin index (before sorting)
  DEPEND_0: spin_angle
  FIELDNAM: Spin Angle Bin
  FORMAT: I3
  UNITS: ' '
  VALIDMAX: 719
  VALIDMIN: 0
  VAR_TYPE: support_data

avg_amplitude:
  <<: *default
  CATDESC: Average star sensor amplitude per spin angle bin
  DEPEND_0: epoch
  DEPEND_1: spin_angle
  FIELDNAM: Average Amplitude
  FILLVAL: -1.0000000E+31
  FORMAT: F12.4
  LABLAXIS: Amplitude
  UNITS: mV

count_per_bin:
  <<: *default
  CATDESC: Number of samples per spin angle bin
  DEPEND_0: epoch
  DEPEND_1: spin_angle
  FIELDNAM: Count Per Bin
  FORMAT: I6
  LABLAXIS: Sample Count
  UNITS: ' '
  VALIDMAX: 100000
  VALIDMIN: 0
