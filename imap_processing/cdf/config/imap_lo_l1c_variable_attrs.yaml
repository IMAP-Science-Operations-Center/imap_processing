default_attrs: &default
  # Assumed values for all variable attrs unless overwritten
  DEPEND_0: epoch
  DISPLAY_TYPE: time_series
  FILLVAL: -9223372036854775808
  FORMAT: F19.3
  UNITS: " "
  VALIDMAX: 9223372036854775807
  VALIDMIN: 0
  VAR_TYPE: data

default_float32_attrs: &default_float32
  <<: *default
  FILLVAL: -1.0e+31
  FORMAT: F12.6
  VALIDMAX: 3.4028235e+38
  VALIDMIN: -3.4028235e+38
  dtype: float32

component:
  CATDESC: Cartesian components (x,y,z)
  FIELDNAM: component
  FORMAT: A3
  LABLAXIS: component
  VAR_TYPE: metadata

# Non-epoch Coordinates
esa_energy_step_label:
  CATDESC: ESA Steps
  FIELDNAM: ESA Steps
  FORMAT: A1
  VAR_TYPE: metadata

esa_energy_step:
  CATDESC: Energy Step
  FIELDNAM: Energy Step
  FORMAT: I1
  LABLAXIS: ESA
  UNITS: " "
  VALIDMAX: 7
  VALIDMIN: 1
  VAR_TYPE: support_data

spin_angle_label:
  CATDESC: Spin angles
  FIELDNAM: Spin angles
  FORMAT: A4
  VAR_TYPE: metadata

spin_angle:
  CATDESC: Spin angle bin center in despun pointing frame
  FIELDNAM: Spin angle
  FORMAT: I4
  LABLAXIS: spin angle
  UNITS: "degrees"
  VALIDMAX: 360
  VALIDMIN: 0
  VAR_TYPE: support_data

off_angle_label:
  CATDESC: Off axis angles
  FIELDNAM: Off axis angles
  FORMAT: A4
  VAR_TYPE: metadata

off_angle:
  CATDESC: Off axis angle bin center in despun pointing frame
  FIELDNAM: Off axis angle
  FORMAT: I4
  LABLAXIS: off angle
  UNITS: "degrees"
  VALIDMAX: 2
  VALIDMIN: -2
  VAR_TYPE: support_data

pointing_start_met:
  <<: *default
  CATDESC: MET of start of pointing
  FIELDNAM: Pointing start time
  FORMAT: I12
  LABLAXIS: pointing start
  UNITS: s

pointing_end_met:
  <<: *default
  CATDESC: MET of end of pointing
  FIELDNAM: Pointing end time
  FORMAT: I12
  LABLAXIS: pointing end
  UNITS: s

start_spin_number:
  <<: *default
  CATDESC: The spin number at the start of the pointing
  FIELDNAM: Spin number at start of pointing
  FORMAT: I12
  LABLAXIS: Start spin

end_spin_number:
  <<: *default
  CATDESC: The spin number at the start of the pointing
  FIELDNAM: Spin number at the end of the pointing
  FORMAT: I12
  LABLAXIS: End spin

pivot_angle:
  <<: *default
  CATDESC: Pivot angle for pointing
  FIELDNAM: Pivot angle
  FORMAT: F8.3
  LABLAXIS: pivot angle
  UNITS: deg
  VALIDMAX: 180.0
  VALIDMIN: 0.0

pivot_angle_de:
  <<: *default
  CATDESC: Pivot angle derived from direct event data
  FIELDNAM: Pivot Angle (DE)
  FORMAT: F8.3
  LABLAXIS: Pivot Angle DE
  UNITS: deg
  VALIDMAX: 180.0
  VALIDMIN: 0.0

esa_mode:
  <<: *default
  CATDESC: Science Mode for Pointing
  DEPEND_1: esa_energy_step
  FIELDNAM: Science Mode
  FORMAT: I12
  LABLAXIS: esa mode

hae_longitude:
  <<: *default
  CATDESC: Bin longitudes in HAE coordinates
  DEPEND_1: spin_angle
  DEPEND_2: off_angle
  FIELDNAM: Bin longitudes
  FORMAT: I12
  LABLAXIS: longitude
  LABL_PTR_1: spin_angle_label
  LABL_PTR_2: off_angle_label
  UNITS: degrees
  VALIDMAX: 360

hae_latitude:
  <<: *default
  CATDESC: Bin latitudes in HAE coordinates
  DEPEND_1: spin_angle
  DEPEND_2: off_angle
  FIELDNAM: Bin latitudes
  FORMAT: I12
  LABLAXIS: latitude
  LABL_PTR_1: spin_angle_label
  LABL_PTR_2: off_angle_label
  UNITS: degrees
  VALIDMAX: 90
  VALIDMIN: -90

exposure_time:
  <<: *default
  CATDESC: Exposure times by ESA step
  DEPEND_1: esa_energy_step
  DEPEND_2: spin_angle
  DEPEND_3: off_angle
  FIELDNAM: Exposure Times
  LABL_PTR_1: esa_energy_step_label
  LABL_PTR_2: spin_angle_label
  LABL_PTR_3: off_angle_label
  UNITS: "s"

triples_counts:
  <<: *default
  CATDESC: Counts for triple coincidence events
  DEPEND_1: esa_energy_step
  DEPEND_2: spin_angle
  DEPEND_3: off_angle
  FIELDNAM: triples coincidence counts
  FORMAT: I12
  LABL_PTR_1: esa_energy_step_label
  LABL_PTR_2: spin_angle_label
  LABL_PTR_3: off_angle_label

doubles_counts:
  <<: *default
  CATDESC: Counts for double coincidence events
  DEPEND_1: esa_energy_step
  DEPEND_2: spin_angle
  DEPEND_3: off_angle
  FIELDNAM: Double coincidence counts
  FORMAT: I12
  LABLAXIS: doubles
  LABL_PTR_1: esa_energy_step_label
  LABL_PTR_2: spin_angle_label
  LABL_PTR_3: off_angle_label

h_counts:
  <<: *default
  CATDESC: Counts for Hydrogen events
  DEPEND_1: esa_energy_step
  DEPEND_2: spin_angle
  DEPEND_3: off_angle
  FIELDNAM: Hydrogen counts
  FORMAT: I12
  LABL_PTR_1: esa_energy_step_label
  LABL_PTR_2: spin_angle_label
  LABL_PTR_3: off_angle_label

h_background_rates:
  <<: *default
  CATDESC: Background Hydrogen rates
  DELTA_MINUS_VAR: h_background_rates_stat_uncert
  DELTA_PLUS_VAR: h_background_rates_stat_uncert
  DEPEND_1: esa_energy_step
  DEPEND_2: spin_angle
  DEPEND_3: off_angle
  FIELDNAM: Background Hydrogen rates
  FORMAT: I12
  LABL_PTR_1: esa_energy_step_label
  LABL_PTR_2: spin_angle_label
  LABL_PTR_3: off_angle_label

h_background_rates_stat_uncert:
  <<: *default
  CATDESC: Background Hydrogen rates statistical uncertainty
  DEPEND_1: esa_energy_step
  DEPEND_2: spin_angle
  DEPEND_3: off_angle
  FIELDNAM: Background Hydrogen rates stat uncertainty
  FORMAT: I12
  LABL_PTR_1: esa_energy_step_label
  LABL_PTR_2: spin_angle_label
  LABL_PTR_3: off_angle_label

h_background_rates_sys_err:
  <<: *default
  CATDESC: Background Hydrogen rates systematic error
  DEPEND_1: esa_energy_step
  DEPEND_2: spin_angle
  DEPEND_3: off_angle
  FIELDNAM: Background Hydrogen rates systematic error
  FORMAT: I12
  LABL_PTR_1: esa_energy_step_label
  LABL_PTR_2: spin_angle_label
  LABL_PTR_3: off_angle_label

o_counts:
  <<: *default
  CATDESC: Count rates for Oxygen events
  DEPEND_1: esa_energy_step
  DEPEND_2: spin_angle
  DEPEND_3: off_angle
  FIELDNAM: Oxygen count rates
  FORMAT: I12
  LABL_PTR_1: esa_energy_step_label
  LABL_PTR_2: spin_angle_label
  LABL_PTR_3: off_angle_label

o_background_rates:
  <<: *default
  CATDESC: Background Oxygen rates
  DELTA_MINUS_VAR: o_background_rates_stat_uncert
  DELTA_PLUS_VAR: o_background_rates_stat_uncert
  DEPEND_1: esa_energy_step
  DEPEND_2: spin_angle
  DEPEND_3: off_angle
  FIELDNAM: Background Oxygen rates
  FORMAT: I12
  LABL_PTR_1: esa_energy_step_label
  LABL_PTR_2: spin_angle_label
  LABL_PTR_3: off_angle_label

o_background_rates_stat_uncert:
  <<: *default
  CATDESC: Background Oxygen rates statistical uncertainty
  DEPEND_1: esa_energy_step
  DEPEND_2: spin_angle
  DEPEND_3: off_angle
  FIELDNAM: Background Oxygen rates stat uncertainty
  FORMAT: I12
  LABL_PTR_1: esa_energy_step_label
  LABL_PTR_2: spin_angle_label
  LABL_PTR_3: off_angle_label

o_background_rates_sys_err:
  <<: *default
  CATDESC: Background Oxygen rates systematic error
  DEPEND_1: esa_energy_step
  DEPEND_2: spin_angle
  DEPEND_3: off_angle
  FIELDNAM: Background Oxygen rates systematic error
  FORMAT: I12
  LABL_PTR_1: esa_energy_step_label
  LABL_PTR_2: spin_angle_label
  LABL_PTR_3: off_angle_label

sc_velocity:
  <<: *default_float32
  CATDESC: x,y,z-components in the HAE coordinate system of the mean velocity vector, in km/s
  FIELDNAM: sc_velocity
  FORMAT: F12.2
  LABLAXIS: spacecraft velocity
  LABL_PTR_1: label_vector_HAE
  UNITS: "km/s"

sc_position:
  <<: *default_float32
  CATDESC: x,y,z-components in the HAE coordinate system of the mean spacecraft position, in km
  FIELDNAM: sc_position
  FORMAT: F12.2
  LABLAXIS: spacecraft position
  LABL_PTR_1: label_vector_HAE
  UNITS: "km"

label_vector_HAE:
  CATDESC: Cartesian components (x,y,z)
  FIELDNAM: Cartesian components
  FORMAT: A5
  VAR_TYPE: metadata

# ---------------------------------------------------------------------------
# imap_lo_l1c_quickmap sky-map variables (dims: esa_level, ecl_lat, ecl_lon).
# NaN in the systematic-error maps is written as the default_float32 FILLVAL
# (-1.0e31); readers should treat that value as fill.
# ---------------------------------------------------------------------------
flux_sys_err:
  <<: *default_float32
  CATDESC: Hydrogen flux systematic error from asymmetric G-factor bounds (geometric mean)
  DEPEND_0: esa_level
  DEPEND_1: ecl_lat
  DEPEND_2: ecl_lon
  FIELDNAM: Hydrogen flux systematic error
  LABLAXIS: flux sys err
  UNITS: "1/(cm^2 s sr keV)"

flux_sys_err_upper:
  <<: *default_float32
  CATDESC: Upper Hydrogen flux systematic error from the lower G-factor bound
  DEPEND_0: esa_level
  DEPEND_1: ecl_lat
  DEPEND_2: ecl_lon
  FIELDNAM: Hydrogen flux systematic error upper
  LABLAXIS: flux sys err hi
  UNITS: "1/(cm^2 s sr keV)"

flux_sys_err_lower:
  <<: *default_float32
  CATDESC: Lower Hydrogen flux systematic error from the upper G-factor bound
  DEPEND_0: esa_level
  DEPEND_1: ecl_lat
  DEPEND_2: ecl_lon
  FIELDNAM: Hydrogen flux systematic error lower
  LABLAXIS: flux sys err lo
  UNITS: "1/(cm^2 s sr keV)"

flux_var_total:
  <<: *default_float32
  CATDESC: Total Hydrogen flux variance (statistical plus systematic)
  DEPEND_0: esa_level
  DEPEND_1: ecl_lat
  DEPEND_2: ecl_lon
  FIELDNAM: Hydrogen total flux variance
  LABLAXIS: flux var total
  UNITS: "1/(cm^2 s sr keV)^2"

cosalpha:
  <<: *default_float32
  CATDESC: RAM-direction projection factor sin(pivot) * sin(spin-angle)
  DEPEND_0: esa_level
  DEPEND_1: ecl_lat
  DEPEND_2: ecl_lon
  FIELDNAM: RAM projection factor cos alpha
  LABLAXIS: cos alpha
  UNITS: " "

# imap_lo_l1c_quickmap coordinates
esa_level:
  CATDESC: ESA energy level
  FIELDNAM: ESA level
  FORMAT: I1
  LABLAXIS: ESA level
  UNITS: " "
  VALIDMAX: 7
  VALIDMIN: 1
  VAR_TYPE: support_data

ecl_lat:
  CATDESC: Ecliptic latitude bin center (ECLIPJ2000)
  FIELDNAM: Ecliptic latitude
  FORMAT: F8.3
  LABLAXIS: ecl lat
  UNITS: "degrees"
  VALIDMAX: 90.0
  VALIDMIN: -90.0
  VAR_TYPE: support_data

ecl_lon:
  CATDESC: Ecliptic longitude bin center (ECLIPJ2000)
  FIELDNAM: Ecliptic longitude
  FORMAT: F8.3
  LABLAXIS: ecl lon
  UNITS: "degrees"
  VALIDMAX: 360.0
  VALIDMIN: 0.0
  VAR_TYPE: support_data

# imap_lo_l1c_quickmap sky-map data variables
counts:
  <<: *default_float32
  CATDESC: Hydrogen counts accumulated per sky-map bin
  DEPEND_0: esa_level
  DEPEND_1: ecl_lat
  DEPEND_2: ecl_lon
  FIELDNAM: Hydrogen counts
  LABLAXIS: counts
  UNITS: " "

exposure:
  <<: *default_float32
  CATDESC: Exposure time accumulated per sky-map bin
  DEPEND_0: esa_level
  DEPEND_1: ecl_lat
  DEPEND_2: ecl_lon
  FIELDNAM: Exposure time
  LABLAXIS: exposure
  UNITS: "s"

rate:
  <<: *default_float32
  CATDESC: Hydrogen count rate (counts / exposure)
  DEPEND_0: esa_level
  DEPEND_1: ecl_lat
  DEPEND_2: ecl_lon
  FIELDNAM: Hydrogen rate
  LABLAXIS: rate
  UNITS: "1/s"

rate_var:
  <<: *default_float32
  CATDESC: Hydrogen count rate variance
  DEPEND_0: esa_level
  DEPEND_1: ecl_lat
  DEPEND_2: ecl_lon
  FIELDNAM: Hydrogen rate variance
  LABLAXIS: rate var
  UNITS: "1/s^2"

flux:
  <<: *default_float32
  CATDESC: Hydrogen flux (rate / (G-factor * energy))
  DEPEND_0: esa_level
  DEPEND_1: ecl_lat
  DEPEND_2: ecl_lon
  FIELDNAM: Hydrogen flux
  LABLAXIS: flux
  UNITS: "1/(cm^2 s sr keV)"

flux_var:
  <<: *default_float32
  CATDESC: Hydrogen flux statistical variance
  DEPEND_0: esa_level
  DEPEND_1: ecl_lat
  DEPEND_2: ecl_lon
  FIELDNAM: Hydrogen flux variance
  LABLAXIS: flux var
  UNITS: "1/(cm^2 s sr keV)^2"

background_rate:
  <<: *default_float32
  CATDESC: Hydrogen background rate
  DEPEND_0: esa_level
  DEPEND_1: ecl_lat
  DEPEND_2: ecl_lon
  FIELDNAM: Hydrogen background rate
  LABLAXIS: bg rate
  UNITS: "1/s"

background_rate_var:
  <<: *default_float32
  CATDESC: Hydrogen background rate variance
  DEPEND_0: esa_level
  DEPEND_1: ecl_lat
  DEPEND_2: ecl_lon
  FIELDNAM: Hydrogen background rate variance
  LABLAXIS: bg rate var
  UNITS: "1/s^2"

background_flux:
  <<: *default_float32
  CATDESC: Hydrogen background flux
  DEPEND_0: esa_level
  DEPEND_1: ecl_lat
  DEPEND_2: ecl_lon
  FIELDNAM: Hydrogen background flux
  LABLAXIS: bg flux
  UNITS: "1/(cm^2 s sr keV)"

background_flux_var:
  <<: *default_float32
  CATDESC: Hydrogen background flux variance
  DEPEND_0: esa_level
  DEPEND_1: ecl_lat
  DEPEND_2: ecl_lon
  FIELDNAM: Hydrogen background flux variance
  LABLAXIS: bg flux var
  UNITS: "1/(cm^2 s sr keV)^2"

signal_to_noise:
  <<: *default_float32
  CATDESC: Signal-to-noise ratio (Hydrogen rate / background rate)
  DEPEND_0: esa_level
  DEPEND_1: ecl_lat
  DEPEND_2: ecl_lon
  FIELDNAM: Signal to noise
  LABLAXIS: S/N
  UNITS: " "

signal_to_noise_var:
  <<: *default_float32
  CATDESC: Signal-to-noise ratio variance
  DEPEND_0: esa_level
  DEPEND_1: ecl_lat
  DEPEND_2: ecl_lon
  FIELDNAM: Signal to noise variance
  LABLAXIS: S/N var
  UNITS: " "