# ----------------------------- Useful variables -----------------------------
uint8_fillval: &uint8_fillval 255
real_fillval: &real_fillval -1.0e+31

min_int: &min_int -9223372036854775808
max_int: &max_int 9223372036854775807

# --------------------------- Default attributes -----------------------------
energy_attrs: &energy_default
  CATDESC: Geometric mean energy per nucleon
  DICT_KEY: SPASE>Particle>ParticleType:Ion,ParticleQuantity:EnergyPerCharge,Qualifier:Characteristic
  FIELDNAM: Energy Table
  FILLVAL: *real_fillval
  FORMAT: F12.6
  LABLAXIS: Energy
  SCALETYP: linear
  UNITS: MeV/nuc
  VALIDMAX: 200.0
  VALIDMIN: 0.0
  VAR_TYPE: support_data

# ------------------------------- Coordinates -------------------------------
epoch:
  DELTA_MINUS_VAR: epoch_delta_minus
  DELTA_PLUS_VAR: epoch_delta_plus

epoch_delta_minus:
  CATDESC: Time from acquisition start to acquisition center
  DICT_KEY: SPASE>Support>SupportQuantity:Temporal,Qualifier:Uncertainty
  FIELDNAM: epoch delta minus
  FILLVAL: *min_int
  FORMAT: I19
  LABLAXIS: Epoch Delta Minus
  SCALETYP: linear
  UNITS: ns
  VALIDMAX: 128000000000
  VALIDMIN: 0
  VAR_TYPE: support_data

epoch_delta_plus:
  CATDESC: Time from acquisition center to acquisition end
  DICT_KEY: SPASE>Support>SupportQuantity:Temporal,Qualifier:Uncertainty
  FIELDNAM: epoch delta plus
  FILLVAL: *min_int
  FORMAT: I19
  LABLAXIS: Epoch Delta Plus
  SCALETYP: linear
  UNITS: ns
  VALIDMAX: 128000000000
  VALIDMIN: 0
  VAR_TYPE: support_data

elevation_angle:
  CATDESC: Elevation Angle
  FIELDNAM: Elevation Angle
  FILLVAL: *real_fillval
  FORMAT: F32.1
  LABLAXIS: Elevation Angle
  SCALETYP: linear
  UNITS: degrees
  VALIDMAX: 180.0
  VALIDMIN: 0.0
  VAR_TYPE: support_data

spin_sector:
  CATDESC: Spin Sector Index
  FIELDNAM: Spin Sector Index
  FILLVAL: *uint8_fillval
  FORMAT: I3
  LABLAXIS: " "
  SCALETYP: linear
  UNITS: " "
  VALIDMAX: 12
  VALIDMIN: 0
  VAR_TYPE: support_data

energy_cno:
  <<: *energy_default
  CATDESC: Geometric mean energy per nucleon for CNO
  DELTA_MINUS_VAR: energy_cno_minus
  DELTA_PLUS_VAR: energy_cno_plus
  FIELDNAM: CNO Energy

energy_fe:
  <<: *energy_default
  CATDESC: Geometric mean energy per nucleon for Fe
  DELTA_MINUS_VAR: energy_fe_minus
  DELTA_PLUS_VAR: energy_fe_plus
  FIELDNAM: Fe Energy

energy_h:
  <<: *energy_default
  CATDESC: Geometric mean energy per nucleon for H
  DELTA_MINUS_VAR: energy_h_minus
  DELTA_PLUS_VAR: energy_h_plus
  FIELDNAM: H Energy

energy_he3he4:
  <<: *energy_default
  CATDESC: Geometric mean energy per nucleon for He3+He4
  DELTA_MINUS_VAR: energy_he3he4_minus
  DELTA_PLUS_VAR: energy_he3he4_plus
  FIELDNAM: He3+He4 Energy

# ------------------------------- Label vars --------------------------------
event_num_label:
  CATDESC: Event Number
  FIELDNAM: Event Number
  FORMAT: A5
  VAR_TYPE: metadata

epoch_delta_minus_label:
  CATDESC: Time from acquisition start to acquisition center
  FIELDNAM: Epoch delta minus
  FORMAT: A18
  VAR_TYPE: metadata

epoch_delta_plus_label:
  CATDESC: Time from acquisition center to acquisition end
  FIELDNAM: Epoch delta plus
  FORMAT: A18
  VAR_TYPE: metadata

elevation_angle_label:
  CATDESC: Elevation Angle
  FIELDNAM: Elevation Angle
  FORMAT: A6
  VAR_TYPE: metadata

spin_sector_label:
  CATDESC: Spin Sector
  DEPEND_1: spin_sector
  FIELDNAM: Spin Sector
  FORMAT: A2
  VAR_TYPE: metadata

# ------------------------------- Labels ------------------------------------
energy_cno_label:
  CATDESC: Energy-channel labels for CNO differential intensity
  FIELDNAM: CNO Energy Channel Labels
  FORMAT: A32
  VAR_TYPE: metadata

energy_fe_label:
  CATDESC: Energy-channel labels for Fe differential intensity
  FIELDNAM: Fe Energy Channel Labels
  FORMAT: A32
  VAR_TYPE: metadata

energy_h_label:
  CATDESC: Energy-channel labels for H differential intensity
  FIELDNAM: H Energy Channel Labels
  FORMAT: A32
  VAR_TYPE: metadata

energy_he3he4_label:
  CATDESC: Energy-channel labels for He3+He4 differential intensity
  FIELDNAM: He3+He4 Energy Channel Labels
  FORMAT: A32
  VAR_TYPE: metadata

# --------------------------- Dataset variable attrs ------------------------
data_quality:
  CATDESC: Indicates whether data quality is suspect (1).
  DEPEND_0: epoch
  DICT_KEY: SPASE>Support>SupportQuantity:DataQuality
  DISPLAY_TYPE: time_series
  FIELDNAM: Data Quality
  FILLVAL: *uint8_fillval
  FORMAT: '%d'
  LABLAXIS: Data Quality
  SCALETYP: linear
  UNITS: ' '
  VALIDMAX: 1
  VALIDMIN: 0
  VAR_TYPE: data

species_dim_attrs: &species_dim_attrs
  DEPEND_0: epoch
  DEPEND_1: energy_{species}
  DEPEND_2: spin_sector
  DEPEND_3: elevation_angle
  LABL_PTR_1: energy_{species}_label
  LABL_PTR_2: spin_sector_label
  LABL_PTR_3: elevation_angle_label

# species:
cno:
  <<: *species_dim_attrs
  CATDESC: Differential intensity for CNO by energy, spin sector, and elevation at x2-spaced energy-per-nucleon channels
  DICT_KEY: SPASE>Particle>ParticleType:Ion,ParticleQuantity:NumberFlux,Qualifier:Differential
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Differential Intensity - CNO
  FILLVAL: *real_fillval
  FORMAT: E14.7
  SCALETYP: log
  UNITS: '# / cm2 s sr MeV/nuc'
  VALIDMAX: 16777216.0
  VALIDMIN: 0.0
  VAR_TYPE: data

fe:
  <<: *species_dim_attrs
  CATDESC: Differential intensity for Fe by energy, spin sector, and elevation at x2-spaced energy-per-nucleon channels
  DICT_KEY: SPASE>Particle>ParticleType:Ion,ParticleQuantity:NumberFlux,Qualifier:Differential
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Differential Intensity - Fe
  FILLVAL: *real_fillval
  FORMAT: F32.1
  SCALETYP: log
  UNITS: '# / cm2 s sr MeV/nuc'
  VALIDMAX: 16777216.0
  VALIDMIN: 0.0
  VAR_TYPE: data

h:
  <<: *species_dim_attrs
  CATDESC: Differential intensity for H by energy, spin sector, and elevation at x2-spaced energy-per-nucleon channels
  DICT_KEY: SPASE>Particle>ParticleType:Ion,ParticleQuantity:NumberFlux,Qualifier:Differential
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Differential Intensity - H
  FILLVAL: *real_fillval
  FORMAT: F32.1
  SCALETYP: log
  UNITS: '# / cm2 s sr MeV/nuc'
  VALIDMAX: 16777216.0
  VALIDMIN: 0.0
  VAR_TYPE: data

he3he4:
  <<: *species_dim_attrs
  CATDESC: Differential intensity for He3+He4 by energy, spin sector, and elevation at x2-spaced energy-per-nucleon channels
  DICT_KEY: SPASE>Particle>ParticleType:Ion,ParticleQuantity:NumberFlux,Qualifier:Differential
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Differential Intensity - He3+He4
  FILLVAL: *real_fillval
  FORMAT: F32.1
  SCALETYP: log
  UNITS: '# / cm2 s sr MeV/nuc'
  VALIDMAX: 16777216.0
  VALIDMIN: 0.0
  VAR_TYPE: data

# uncertainties:
unc_cno:
  <<: *species_dim_attrs
  CATDESC: Uncertainty in differential intensity for CNO by energy, spin sector, and elevation at x2-spaced energy-per-nucleon channels
  COORDINATE_SYSTEM: instrument frame
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Uncertainty - CNO
  FILLVAL: *real_fillval
  FORMAT: F32.1
  SCALETYP: log
  SI_CONVERSION: ' > '
  UNITS: '# / cm2 s sr MeV/nuc'
  VALIDMAX: 4096.0
  VALIDMIN: 0.0
  VAR_TYPE: data

unc_fe:
  <<: *species_dim_attrs
  CATDESC: Uncertainty in differential intensity for Fe by energy, spin sector, and elevation at x2-spaced energy-per-nucleon channels
  COORDINATE_SYSTEM: instrument frame
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Uncertainty - Fe
  FILLVAL: *real_fillval
