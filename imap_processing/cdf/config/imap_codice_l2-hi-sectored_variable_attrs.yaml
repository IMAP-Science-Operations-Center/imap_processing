  SCALETYP: log
  SI_CONVERSION: ' > '
  UNITS: '# / cm2 s sr MeV/nuc'
  VALIDMAX: 4096.0
  VALIDMIN: 0.0
  VAR_TYPE: data

unc_h:
  <<: *species_dim_attrs
  CATDESC: Uncertainty in differential intensity for H by energy, spin sector, and elevation at x2-spaced energy-per-nucleon channels
  COORDINATE_SYSTEM: instrument frame
  DEPEND_0: epoch
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Uncertainty - H
  FILLVAL: *real_fillval
  FORMAT: F32.1
  SCALETYP: log
  SI_CONVERSION: ' > '
