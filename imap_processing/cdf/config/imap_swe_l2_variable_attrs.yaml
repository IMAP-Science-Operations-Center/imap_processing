# <=== Coordinates ===>
esa_step:
  CATDESC: Energy step id in lookup table
  FIELDNAM: Energy Step
  FILLVAL: -9223370000000000000
  FORMAT: I2
  LABLAXIS: Energy Step
  SCALETYP: linear
  UNITS: " "
  VALIDMAX: 23
  VALIDMIN: 0
  VAR_TYPE: support_data

energy:
  CATDESC: Energy of the particle in eV
  FIELDNAM: Energy (eV)
  FILLVAL: -9223370000000000000
  FORMAT: E10.4
  LABLAXIS: Energy
  SCALETYP: linear
  UNITS: eV
  VALIDMAX: 6000.0
  VALIDMIN: 0.0
  VAR_TYPE: support_data

spin_sector:
  CATDESC: Spin sector. 30 measurements nominally
  FIELDNAM: Spin Sector
  FILLVAL: -9223370000000000000
  FORMAT: I2
  LABLAXIS: Spin Sector
  SCALETYP: linear
  UNITS: " "
  VALIDMAX: 29
  VALIDMIN: 0
  VAR_TYPE: support_data

inst_az:
  CATDESC: Spin angle in despun spacecraft coordinates. Angle resolution is 12 degree, with bin centers 6 - 354 degree (30 bins)
  FIELDNAM: Spin Angle
  FILLVAL: -9223370000000000000
  FORMAT: E10.4
  LABLAXIS: Degree
  SCALETYP: linear
  UNITS: Degree
  VALIDMAX: 359.999
  VALIDMIN: 0.00
  VAR_NOTES: >
    Spin angle bin centers in despun spacecraft coordinates.
  VAR_TYPE: support_data

cem_id:
  CATDESC: CEM detector number
  FIELDNAM: CEM Number
  FILLVAL: -9223370000000000000
  FORMAT: I2
  LABLAXIS: CEM Number
  SCALETYP: linear
  UNITS: " "
  VALIDMAX: 6
  VALIDMIN: 0
  VAR_TYPE: support_data

inst_el:
  CATDESC: Polar angle of each CEM detector relative to spin axis. Angle resolution is 21 degree, with bin centers -63 - 63 degree (7 bins)
  FIELDNAM: Polar Angle
  FILLVAL: -9223370000000000000
  FORMAT: I4
  LABLAXIS: Degree
  SCALETYP: linear
  UNITS: Degree
  VALIDMAX: 65
  VALIDMIN: -65
  VAR_TYPE: support_data

cycle:
  CATDESC: Full cycle data takes 4 spins' data
  FIELDNAM: Quarter Cycle
  FILLVAL: -9223370000000000000
  FORMAT: I2
  LABLAXIS: Cycle
  SCALETYP: linear
  UNITS: " "
  VALIDMAX: 3
  VALIDMIN: 0
  VAR_TYPE: support_data

# <=== Label Attributes ===>
# LABL_PTR_i expects VAR_TYPE of metadata with char data type
esa_step_label:
  CATDESC: Energy step id in lookup table
  FIELDNAM: Energy Step ID
  FORMAT: A2
  VAR_TYPE: metadata

spin_sector_label:
  CATDESC: Spin sector. 30 measurements nominally
  FIELDNAM: Measurement
  FORMAT: A2
  VAR_TYPE: metadata

cem_id_label:
  CATDESC: Data rates of each CEM detector
  FIELDNAM: CEM Rates
  FORMAT: A1
  VAR_TYPE: metadata

energy_label:
  CATDESC: Energy of the particle in eV
  FIELDNAM: Energy
  FORMAT: A5
  VAR_TYPE: metadata

inst_az_label:
  CATDESC: Spin angle bins in despun spacecraft coordinates
  FIELDNAM: Spin Angle
  FORMAT: A3
  VAR_TYPE: metadata

inst_el_label:
  CATDESC: Polar angle of each CEM detector relative to spin axis
  FIELDNAM: CEM Angle
  FORMAT: A3
  VAR_TYPE: metadata

# <=== Data Variables ===>

inst_az_spin_sector:
  CATDESC: Spin angle in despun spacecraft coordinates organized by ESA step and spin sector
  DEPEND_0: epoch
  DEPEND_1: esa_step
  DEPEND_2: spin_sector
  DICT_KEY: SPASE>Support>SupportQuantity:SpinPhase,Qualifier:Array,CoordinateSystemName:SC,CoordinateRepresentation:Spherical
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Spin Angle Spin Sector
  FILLVAL: -1.0E+31
  FORMAT: E10.5
  LABL_PTR_1: esa_step_label
  LABL_PTR_2: spin_sector_label
  UNITS: Degree
  VALIDMAX: 359.99
  VALIDMIN: 0.0
  VAR_TYPE: data

phase_space_density_spin_sector:
  CATDESC: Phase space density organized by ESA step and spin sector and CEM
  DELTA_MINUS_VAR: psd_stat_uncert
  DELTA_PLUS_VAR: psd_stat_uncert
  DEPEND_0: epoch
  DEPEND_1: esa_step
  DEPEND_2: spin_sector
  DEPEND_3: cem_id
  DICT_KEY: SPASE>Particle>ParticleType:Electron,ParticleQuantity:PhaseSpaceDensity,Qualifier:Array
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Phase Space Density Spin Sector
  FILLVAL: -1.0E+31
  FORMAT: E14.7
  LABL_PTR_1: esa_step_label
  LABL_PTR_2: spin_sector_label
  LABL_PTR_3: cem_id_label
  UNITS: s^3 / cm^6
  VALIDMAX: 0.000000000000001
  VALIDMIN: 0.0
  VAR_TYPE: data


phase_space_density:
  CATDESC: Phase space density organized by energy (eV), spin angle, CEM angle
  DELTA_MINUS_VAR: psd_stat_uncert
  DELTA_PLUS_VAR: psd_stat_uncert
  DEPEND_0: epoch
  DEPEND_1: energy
  DEPEND_2: inst_az
  DEPEND_3: inst_el
  DICT_KEY: SPASE>Particle>ParticleType:Electron,ParticleQuantity:PhaseSpaceDensity,Qualifier:Array
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Phase Space Density
  FILLVAL: -1.0E+31
  FORMAT: E14.7
  LABL_PTR_1: energy_label
  LABL_PTR_2: inst_az_label
  LABL_PTR_3: inst_el_label
  UNITS: s^3 / cm^6
  VALIDMAX: 1.0E-15
  VALIDMIN: 0.0
  VAR_TYPE: data

flux_spin_sector:
  CATDESC: Number flux organized by ESA step and spin sector and CEM
  DELTA_MINUS_VAR: flux_stat_uncert
  DELTA_PLUS_VAR: flux_stat_uncert
  DEPEND_0: epoch
  DEPEND_1: esa_step
  DEPEND_2: spin_sector
  DEPEND_3: cem_id
  DICT_KEY: SPASE>Particle>ParticleType:Electron,ParticleQuantity:NumberFlux,Qualifier:Array
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Flux Spin Sector
  FILLVAL: -1.0E+31
  FORMAT: E14.7
  LABL_PTR_1: esa_step_label
  LABL_PTR_2: spin_sector_label
  LABL_PTR_3: cem_id_label
  UNITS: 1 / (eV * cm^2 * s * ster)
  VALIDMAX: 1.0E+9
  VALIDMIN: 0.0
  VAR_TYPE: data

flux:
  CATDESC: Number flux organized by energy (eV), spin angle, CEM angle
  DELTA_MINUS_VAR: flux_stat_uncert
  DELTA_PLUS_VAR: flux_stat_uncert
  DEPEND_0: epoch
  DEPEND_1: energy
  DEPEND_2: inst_az
  DEPEND_3: inst_el
  DICT_KEY: SPASE>Particle>ParticleType:Electron,ParticleQuantity:NumberFlux,Qualifier:Array
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Flux
  FILLVAL: -1.0E+31
  FORMAT: E14.7
  LABL_PTR_1: energy_label
  LABL_PTR_2: inst_az_label
  LABL_PTR_3: inst_el_label
  UNITS: 1 / (eV * cm^2 * s * ster)
  VALIDMAX: 1.0E+9
  VALIDMIN: 0.0
  VAR_TYPE: data

psd_stat_uncert:
  CATDESC: Phase space density statistical uncertainty
  DEPEND_0: epoch
  DEPEND_1: esa_step
  DEPEND_2: spin_sector
  DEPEND_3: cem_id
  DICT_KEY: SPASE>Particle>ParticleType:Electron,ParticleQuantity:PhaseSpaceDensity,Qualifier:Uncertainty
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Phase Space Density Stats Uncertainty
  FILLVAL: -1.0000000E+31
  FORMAT: E19.5
  LABL_PTR_1: esa_step_label
  LABL_PTR_2: spin_sector_label
  LABL_PTR_3: cem_id_label
  SCALETYP: linear
  UNITS: s^3 / cm^6
  VALIDMAX: 1.7976931348623157e+308 # TODO: find actual value
  VALIDMIN: 0.0
  VAR_TYPE: support_data

flux_stat_uncert:
  CATDESC: Flux statistical uncertainty
  DEPEND_0: epoch
  DEPEND_1: esa_step
  DEPEND_2: spin_sector
  DEPEND_3: cem_id
  DICT_KEY: SPASE>Particle>ParticleType:Electron,ParticleQuantity:NumberFlux,Qualifier:Uncertainty
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Flux Stats Uncertainty
  FILLVAL: -1.0000000E+31
  FORMAT: E19.5
  LABL_PTR_1: esa_step_label
  LABL_PTR_2: spin_sector_label
  LABL_PTR_3: cem_id_label
  SCALETYP: linear
  UNITS: 1 / (eV * cm^2 * s * ster)
  VALIDMAX: 1.7976931348623157e+308 # TODO: find actual value
  VALIDMIN: 0.0
  VAR_TYPE: support_data

acquisition_time:
  CATDESC: Acquisition time organized by ESA step and spin sector
  DEPEND_0: epoch
  DEPEND_1: esa_step
  DEPEND_2: spin_sector
  DICT_KEY: SPASE>Support>SupportQuantity:Temporal,Qualifier:Array
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Acquisition time by ESA step and spin sector
  FILLVAL: -1.0E+31
  FORMAT: E20.4
  LABL_PTR_1: esa_step_label
  LABL_PTR_2: spin_sector_label
  UNITS: sec
  VALIDMAX: 9223372036854775807
  VALIDMIN: 0
  VAR_NOTES: >
    This stores the acquisition times of each measurement. This time is
    calculated by combining ACQ_START_COARSE, ACQ_START_FINE,
    acquisition duration and settle duration. It is center time of each
    science measurement (each energy and angle step).
  VAR_TYPE: support_data

acq_duration:
  CATDESC: Acquisition duration
  DEPEND_0: epoch
  DEPEND_1: esa_step
  DEPEND_2: spin_sector
  DICT_KEY: SPASE>Support>SupportQuantity:Temporal,Qualifier:Array
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Acquisition Duration
  FILLVAL: 4294967295
  FORMAT: I10
  LABL_PTR_1: esa_step_label
  LABL_PTR_2: spin_sector_label
  UNITS: microseconds
  VALIDMAX: 4290000000
  VALIDMIN: 0
  VAR_TYPE: support_data

data_quality:
  CATDESC: >
    In-flight calibration quality flags. Bit 2 (LAST_CAL_INTERVAL): set if any
    acquisition time in this cycle was extrapolated using the last two entries
    in the calibration table.
  DEPEND_0: epoch
  DICT_KEY: SPASE>Support>SupportQuantity:DataQuality
  DISPLAY_TYPE: time_series
  FIELDNAM: SWE data quality flags
  FILLVAL: 255
  FORMAT: I3
  SCALETYP: linear
  UNITS: " "
  VALIDMAX: 255
  VALIDMIN: 0
  VAR_NOTES: >
    There is 1 flag currently in use. Stored as a bitwise flag. Bit 2
    (LAST_CAL_INTERVAL, value 4): counter values were extrapolated using the last two
    calibration table entries. All other bits are reserved.
  VAR_TYPE: support_data
