instrument_base: &instrument_base
  Descriptor: SWAPI>Solar Wind and Pickup Ion
  Instrument_type: Particles (space)
  TEXT: >
    The Solar Wind and Pickup Ion (SWAPI) instrument onboard Interstellar Mapping
    and Acceleration Probe (IMAP) is a top-hat electrostatic analyzer designed to
    measure energy-per-charge distributions of solar wind protons (H+), alpha
    particles (He++), and interstellar He+ pickup ions (PUIs), across a range of
    0.1 to 20 keV/q. See
    https://imap.princeton.edu/spacecraft/instruments/solar-wind-and-pickup-ions-swapi
    for more details. SWAPI's Level 1 data contains primary, secondary, and
    coincidence counts per ESA voltage step and time. Level 2 data converts these
    counts into count rates using a constant livetime of 145ms and includes the
    ESA energy associated with each voltage step.

imap_swapi_l1_sci:
  <<: *instrument_base
  Data_type: L1_SCI>Level-1 Science data
  Logical_source: imap_swapi_l1_sci
  Logical_source_description: IMAP SWAPI Instrument Level-1 Science Data

imap_swapi_l1a_hk:
  <<: *instrument_base
  Data_type: L1A_HK>Level-1A Housekeeping data
  Logical_source: imap_swapi_l1a_hk
  Logical_source_description: IMAP SWAPI Instrument Level-1A Housekeeping Data

imap_swapi_l1b_hk:
  <<: *instrument_base
  Data_type: L1B_HK>Level-1B Housekeeping data
  Logical_source: imap_swapi_l1b_hk
  Logical_source_description: IMAP SWAPI Instrument Level-1B Housekeeping Data

imap_swapi_l2_sci:
  <<: *instrument_base
  Data_type: L2_SCI>Level-2 Science data
  Logical_source: imap_swapi_l2_sci
  Logical_source_description: IMAP SWAPI Instrument Level-2 Science Data
