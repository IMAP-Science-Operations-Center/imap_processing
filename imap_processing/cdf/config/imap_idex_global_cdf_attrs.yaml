instrument_base: &instrument_base
  Descriptor: IDEX>Interstellar Dust Experiment
  Instrument_type: Particles (space)
  TEXT: >
    The Interstellar Dust Experiment (IDEX) is a time-of-flight (TOF)
    dust impact ionization mass spectrometer on the IMAP mission that
    provides the elemental composition, speed, and mass distributions
    of interstellar dust and interplanetary dust particles. Each record
    contains the data from a single dust impact. See
    https://imap.princeton.edu/spacecraft/instruments/interstellar-dust-experiment-idex
    for more details.

imap_idex_l1a_sci:
  <<: *instrument_base
  Data_type: L1A_SCI-10DAYS>Level-1A Science Data
  Logical_source: imap_idex_l1a_sci-10days
  Logical_source_description: IMAP Mission IDEX Instrument Level-1A 10-Day Data
  MODS:
    - >-
      Major version 2, Sept. 14, 2026 — Adds event-classification flags identifying
      science, noise-capture, pulser, and candidate dust-impact events,
      together with saturation flags for all six waveform channels. The
      underlying telemetry and waveform samples are otherwise unchanged for
      equivalent inputs.

imap_idex_l1a_msg-10days:
  <<: *instrument_base
  Data_type: L1A_MSG-10DAYS>Level-1A Event Message Data
  Logical_source: imap_idex_l1a_msg-10days
  Logical_source_description: IMAP Mission IDEX Instrument Level-1A Event Message Data
  MODS:
    - >-
      Major version 2, Sept. 14, 2026 — No substantive schema or processing-algorithm
      changes. Reissued under Major Version 2 for consistency with the
      updated IDEX product series.

imap_idex_l1a_catlst-10days:
  <<: *instrument_base
  Data_type: L1A_CATLST-10DAYS>Level-1A Packet Catalog Summary Data
  Logical_source: imap_idex_l1a_catlst-10days
  Logical_source_description: IMAP Mission IDEX Instrument Level-1A Packet Catalog Summary Data

imap_idex_l1b_sci:
  <<: *instrument_base
  Data_type: L1B_SCI-10DAYS>Level-1B Science 10-Day Data
  Logical_source: imap_idex_l1b_sci-10days
  Logical_source_description: IMAP Mission IDEX Instrument Level-1B 10-Day Data
  MODS:
    - >-
      Major version 2, Sept. 14, 2026 — Propagates the new event-classification and
      saturation flags, corrects the TOF waveform and trigger-level
      conversion to milliamperes, and reports spin phase in the IDEX
      instrument frame rather than the spacecraft frame.

imap_idex_l1b_msg-10days:
  <<: *instrument_base
  Data_type: L1B_MSG-10DAYS>Level-1B Event Message Data
  Logical_source: imap_idex_l1b_msg-10days
  Logical_source_description: IMAP Mission IDEX Instrument Level-1B Event Message Data
  MODS:
    - >-
      Major version 2, Sept. 14, 2026 — Improves pulser-state extraction by
      recognizing a pulser-off message occurring within five seconds of a
      pulser-on message, even when other messages occur between them. This
      preserves valid pulser transitions that were omitted in Major Version
      1; science on/off processing is unchanged.

imap_idex_l1b_catlst-10days:
  <<: *instrument_base
  Data_type: L1B_CATLST-10DAYS>Level-1B Packet Catalog Summary Data
  Logical_source: imap_idex_l1b_catlst-10days
  Logical_source_description: IMAP Mission IDEX Instrument Level-1B Packet Catalog Summary Data

imap_idex_l2a_sci:
  <<: *instrument_base
  Data_type: L2A_SCI-10DAYS>Level-2A Science 10-Day Data
  Logical_source: imap_idex_l2a_sci-10days
  Logical_source_description: IMAP Mission IDEX Instrument Level-2A 10-Day Data
  MODS:
    - >-
      Major version 2, Sept. 14, 2026 — Propagates the new event and saturation
      flags and uses them to suppress invalid impact charges, velocities,
      and masses for saturated or non-science events. Ion-grid velocity is
      now estimated from the ion-grid-to-target charge ratio, with mass
      derived from the selected target charge. Inherits the corrected
      IDEX-frame spin phase.

imap_idex_l2b_sci:
  <<: *instrument_base
  Data_level: 2B
  Data_type: L2B_SCI-10DAYS>Level-2B Science 10-Day Data
  Logical_source: imap_idex_l2b_sci-10days
  Logical_source_description: IMAP Mission IDEX Instrument Level-2B 10-Day Data
  MODS:
    - >-
      Major version 2, Sept. 14, 2026 — Initial release. Numbered Major
      Version 2, with no prior Major Version 1 release, to keep major
      version numbers aligned with the upstream IDEX Level 1/Level 2A
      products.

imap_idex_l2c_sci-rectangular:
  <<: *instrument_base
  Data_level: 2C
  Data_type: L2C_RECTANGULAR-MAP-10DAYS>Level-2C Rectangular Map 10-Day Data
  Logical_source: imap_idex_l2c_rectangular-map-10days
  Logical_source_description: IMAP Mission IDEX Instrument Level-2C Rectangular Map 10-Day Data
