# <=== Defaults ===>
# Default values for variable attrs unless overwritten
default_attrs: &default
  DEPEND_0: epoch
  DISPLAY_TYPE: time_series
  FILLVAL: -9223372036854775808
  FORMAT: I12
  VALIDMIN: 0
  VALIDMAX: 9223372036854775807
  VAR_TYPE: data
  UNITS: ' '
  SCALETYP: linear

default_uint8_attrs: &default_uint8
  <<: *default
  FILLVAL: 255
  FORMAT: I3
  VALIDMIN: 0
  VALIDMAX: 255
  dtype: uint8

default_uint16_attrs: &default_uint16
  <<: *default
  FILLVAL: 65535
  FORMAT: I5
  VALIDMIN: 0
  VALIDMAX: 65535
  dtype: uint16

default_uint32_attrs: &default_uint32
  <<: *default
  FILLVAL: 4294967295
  FORMAT: I10
  VALIDMIN: 0
  VALIDMAX: 4294967295
  dtype: uint32

default_int64_attrs: &default_int64
  <<: *default
  FILLVAL: -9223372036854775808
  FORMAT: I20
  VALIDMIN: -9223372036854775808
  VALIDMAX: 9223372036854775807
  dtype: int64

default_int32_attrs: &default_int32
  <<: *default
  FILLVAL: -2147483648
  FORMAT: I10
  VALIDMIN: -2147483648
  VALIDMAX: 2147483647
  dtype: int32

default_float32_attrs: &default_float32
  <<: *default
  FILLVAL: .NAN
  FORMAT: F10.2
  VALIDMIN: -3.4028235e+38
  VALIDMAX: 3.4028235e+38
  dtype: float32

hk_support_attrs: &hk_support_default
  <<: *default
  DISPLAY_TYPE: no_plot
  VAR_TYPE: ignore_data

hk_default_attrs: &hk_default
  <<: *default
  VALIDMAX: 4095
  FORMAT: I4

index_support_attrs: &index_support_default
  <<: *default_uint32
  DISPLAY_TYPE: no_plot
  VAR_TYPE: support_data
  VALIDMAX: 1000

energy_support_attrs: &energy_support_default
  <<: *default
  DISPLAY_TYPE: no_plot
  VAR_TYPE: support_data
  VALIDMAX: 1000
  LABLAXIS: Energy
  UNITS: MeV
  FORMAT: F5.1

counts_support_attrs: &counts_support_default
  <<: *default
  DISPLAY_TYPE: no_plot
  VAR_TYPE: support_data
  FILLVAL: -1.00E+31
  VALIDMIN: 0
  VALIDMAX: 1000

counts_attrs: &counts_default
  <<: *default
  DISPLAY_TYPE: time_series
  VAR_TYPE: data
  FORMAT: I10
  VALIDMIN: 0
  VALIDMAX: 10000000000
  UNITS: counts
  SCALETYP: log

# <=== Coordinates ===>
sc_tick:
  <<: *default_uint32
  CATDESC: Raw spacecraft tick time per integration
  FIELDNAM: Spacecraft Tick
  LABLAXIS: SC_Tick
  FORMAT: I10
  VAR_TYPE: support_data
  DISPLAY_TYPE: no_plot
  UNITS: ''
  SCALETYP: linear

