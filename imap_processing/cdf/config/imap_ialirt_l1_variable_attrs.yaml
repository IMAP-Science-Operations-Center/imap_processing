default_attrs: &default
  # Assumed values for all variable attrs unless overwritten
  DEPEND_0: epoch
  DISPLAY_TYPE: time_series
  FILLVAL: -9223372036854775808
  FORMAT: I12
  VALIDMIN: -9223372036854775808
  VALIDMAX: 9223372036854775807
  VAR_TYPE: data
  UNITS: " "

component:
  CATDESC: Component direction (x, y, z)
  FIELDNAM: Vector component
  LABLAXIS: Component
  FORMAT: A3
  VAR_TYPE: metadata
  UNITS: " "

RTN_component:
  CATDESC: Component direction (radial, tangential, normal)
  FIELDNAM: RTN vector component
  LABLAXIS: RTN component
  FORMAT: A3
  VAR_TYPE: metadata
  UNITS: " "

esa_step:
  CATDESC: ESA step number. The nominal central energies for the 8 i-ALiRT channels are 100.4, 140, 194, 270, 376, 523, 727, and 1011 eV.
  FIELDNAM: ESA step index
  LABLAXIS: ESA step
  FORMAT: I2
  VALIDMIN: 0
  VALIDMAX: 7
  VAR_TYPE: metadata
  UNITS: " "

codice_hi_h_spin_angle:
