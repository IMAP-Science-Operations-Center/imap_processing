codice_hi_h:
  <<: *default_float32
  CATDESC: H intensity in 4 spin angle bins, 15 energy ranges, 4 spin sector bins, and 4 azimuth bins
  FIELDNAM: H intensity
  LABLAXIS: H intensity
  UNITS: "# / cm2-sr-s- MeV"
  VALIDMIN: 0
  VALIDMAX: 100000000.0
  DEPEND_1: codice_hi_h_spin_angle
  DEPEND_2: codice_hi_h_energy_range
  DEPEND_3: codice_hi_h_spin_sector
  DEPEND_4: codice_hi_h_azimuth
  VAR_NOTES: Energy ranges (MeV) are 0.0200–0.0283, 0.0283–0.0400, 0.0400–0.0566, 0.0566–0.0800, 0.0800–0.113, 0.113–0.160, 0.160–0.226, 0.226–0.320, 0.320–0.453, 0.453–0.640, 0.640–0.905, 0.905–1.28, 1.28–1.81, 1.81–2.56, 2.56–3.62.

