exposure_factor:
  <<: *default_float32
  CATDESC: Exposure time calculated from multiple pointing sets.
  FIELDNAM: exposure_times
  # LABLAXIS: exposure times
  # TODO: come back to form
  DEPEND_0: epoch
  DEPEND_1: healpix_index
  UNITS: seconds
  VAR_TYPE: data
  LABL_PTR_1: healpix_index_label

flux:
  <<: *default_float32
  CATDESC: Flux calculated from multiple pointing sets.
  FIELDNAM: flux
  # LABLAXIS: flux
  # TODO: come back to format
  UNITS: counts/(s * cm^3 * Sr * KeV)
  DEPEND_0: epoch
  DEPEND_1: energy_bin_geometric_mean
  DEPEND_2: healpix_index
  VAR_TYPE: data
  LABL_PTR_1: energy_bin_geometric_mean_label
  LABL_PTR_2: healpix_index_label

flux_uncertainty:
  <<: *default_float32
  CATDESC: Statistical uncertainty on flux.
  FIELDNAM: flux uncertainty
  # LABLAXIS: flux uncertainty
  # TODO: come back to format
  UNITS: counts/(s * cm^3 * Sr * KeV)
  DEPEND_0: epoch
  DEPEND_1: energy_bin_geometric_mean
  DEPEND_2: healpix_index
  VAR_TYPE: data
  LABL_PTR_1: energy_bin_geometric_mean_label
  LABL_PTR_2: healpix_index_label

sensitivity:
  <<: *default_float32
  CATDESC: Calibration/sensitivity factor calculated from multiple pointing sets.
  FIELDNAM: sensitivity
  # LABLAXIS: sensitivity
  # TODO: come back to format
  UNITS: cm^-3
  DEPEND_0: epoch
  DEPEND_1: energy_bin_geometric_mean
  DEPEND_2: healpix_index
  VAR_TYPE: data
  LABL_PTR_1: energy_bin_geometric_mean_label
  LABL_PTR_2: healpix_index_label

observation_time:
  <<: *default
  CATDESC: Exposure time weighted mean of L1C pointing epochs.
  FIELDNAM: observation_time
  # LABLAXIS: observation time
  # TODO: come back to format
  UNITS: " "
  DEPEND_0: epoch
  DEPEND_1: healpix_index
  VAR_TYPE: data
  LABL_PTR_1: healpix_index_label
