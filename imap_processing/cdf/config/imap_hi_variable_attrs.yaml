# ------- Default attributes section -------
default_attrs: &default
  DEPEND_0: epoch
  DISPLAY_TYPE: time_series
  FORMAT: I12
  SCALE_TYPE: linear
  UNITS: " "
  VAR_TYPE: data

default_uint8_attrs: &default_uint8
  <<: *default
  FILLVAL: 255
  FORMAT: I3
  VALIDMAX: 255
  VALIDMIN: 0
  dtype: uint8

default_uint16_attrs: &default_uint16
  <<: *default
  FILLVAL: 65535
  FORMAT: I5
  VALIDMAX: 65535
  VALIDMIN: 0
  dtype: uint16

default_uint32_attrs: &default_uint32
  <<: *default
  FILLVAL: 4294967295
  FORMAT: I10
  VALIDMAX: 4294967295
  VALIDMIN: 0
  dtype: uint32

default_int64_attrs: &default_int64
  <<: *default
  FILLVAL: -9223372036854775808
  FORMAT: I20
  VALIDMAX: 9223372036854775807
  VALIDMIN: -9223372036854775808
  dtype: int64

default_int32_attrs: &default_int32
  <<: *default
  FILLVAL: -2147483648
  FORMAT: I10
  VALIDMAX: 2147483647
  VALIDMIN: -2147483648
  dtype: int32

default_float32_attrs: &default_float32
  <<: *default
  FILLVAL: -1.0e31
  FORMAT: F10.2
  VALIDMAX: 3.4028235e+38
  VALIDMIN: -3.4028235e+38
  dtype: float32

default_float64_attrs: &default_float64
  <<: *default
  FILLVAL: -1.0e31
  FORMAT: F10.2
  VALIDMAX: 1.7976931348623157e+308
  VALIDMIN: -1.7976931348623157e+308
  dtype: float64

default_ccsds_version: &default_ccsds_version
  <<: *default_uint8
  CATDESC: CCSDS packet version number
  FIELDNAM: CCSDS version
  VAR_TYPE: support_data

default_ccsds_type: &default_ccsds_type
  <<: *default_uint8
  CATDESC: CCSDS packet type
  FIELDNAM: CCSDS type
  VAR_TYPE: support_data

default_ccsds_sec_hdr_flg: &default_ccsds_sec_hdr_flg
  <<: *default_uint8
  CATDESC: CCSDS secondary header flag
  FIELDNAM: CCSDS secondary header flag
  VAR_TYPE: support_data

default_ccsds_pkt_apid: &default_ccsds_pkt_apid
  <<: *default_uint16
  CATDESC: CCSDS application process ID
  FIELDNAM: CCSDS APID
  VAR_TYPE: support_data

default_ccsds_seq_flgs: &default_ccsds_seq_flgs
  <<: *default_uint8
  CATDESC: CCSDS sequence flags
  FIELDNAM: CCSDS sequence flags
  VAR_TYPE: support_data

default_ccsds_src_seq_ctr: &default_ccsds_src_seq_ctr
  <<: *default_uint16
  CATDESC: CCSDS source sequence counter
  FIELDNAM: CCSDS sequence counter
  VAR_TYPE: support_data

default_ccsds_pkt_len: &default_ccsds_pkt_len
  <<: *default_uint16
  CATDESC: CCSDS packet length
  FIELDNAM: CCSDS packet length
  VAR_TYPE: support_data

default_ccsds_cksum: &default_ccsds_cksum
  <<: *default_uint16
  CATDESC: CCSDS packet checksum
  FIELDNAM: CCSDS packet checksum
  VAR_TYPE: support_data

default_ccsds_met: &hi_ccsds_met
  <<: *default_uint32
  CATDESC: CCSDS mission elapsed time (MET). 32-bit integer value that represents the MET in seconds.
  FIELDNAM: Mission Elapsed Time(MET)
  LABLAXIS: CCSDS MET
  UNITS: sec
  VAR_TYPE: support_data

hi_esa_step: &hi_esa_step
  <<: *default_uint8
  CATDESC: Zero based index indicates which row of onboard stepping table was used
  FIELDNAM: ESA step
  FILLVAL: 255
  FORMAT: I2
  LABLAXIS: ESA step
  VALIDMAX: 16
  VALIDMIN: 0
  VAR_NOTES: >
    ESA (electrostatic analyzer) stepping number is 4-bit integer value that indicates
    which row of the onboard stepping table was used to set voltages of the inner and
    outer ESA surfaces.

# ======= L1A DE Section =======
hi_de_src_seq_ctr:
  <<: *default_ccsds_src_seq_ctr

hi_de_pkt_len:
  <<: *default_ccsds_pkt_len

hi_de_ccsds_met:
  <<: *hi_ccsds_met

hi_de_last_spin_num:
  <<: *default_uint8
  CATDESC: Spin number (1-based) for the first spin in the packet
  FIELDNAM: last spin
  FORMAT: I2
  LABLAXIS: last spin
  VALIDMAX: 15

hi_de_spin_invalids:
  <<: *default_uint8
  CATDESC: Binary mask where a 1-bit indicates an invalid spin for corresponding spin in packet
  FIELDNAM: spin flags
  FORMAT: I3
  LABLAXIS: spin flag

hi_de_esa_step:
  <<: *hi_esa_step

hi_de_esa_step_seconds:
  <<: *default_uint32
  CATDESC: Coarse mission elapsed time (MET) of when the ESA was stepped
  DISPLAY_TYPE: time_series
  FIELDNAM: Coarse ESA step MET
  LABLAXIS: Coarse ESA step MET
  UNITS: seconds
  VAR_TYPE: support_data

hi_de_esa_step_milliseconds:
  <<: *default_uint16
  CATDESC: Fine mission elapsed time (MET) of when the ESA was stepped
  DISPLAY_TYPE: time_series
  FIELDNAM: Fine ESA step MET
  LABLAXIS: Fine ESA step MET
  UNITS: ms
  VAR_TYPE: support_data

hi_de_event_met:
  <<: *default_float64
  CATDESC: Mission Elapsed Time (MET) in seconds of Direct Event
  DISPLAY_TYPE: no_plot
  FIELDNAM: Direct Event MET
  LABLAXIS: DE MET
  UNITS: seconds
  VAR_TYPE: support_data

hi_de_de_tag:
  <<: *default_uint16
  CATDESC: Ticks (nominally 1999us) since last meta-event
  DEPEND_0: event_met
  FIELDNAM: Direct Event Time Tag
  LABLAXIS: DE Time Tag

hi_de_trigger_id:
  <<: *default_uint8
  CATDESC: Trigger ID of the detector that was hit first
  DEPEND_0: event_met
  FIELDNAM: Trigger ID
  FILLVAL: 0
  FORMAT: I1
  LABLAXIS: ID
  VALIDMAX: 3
  VALIDMIN: 1
  VAR_NOTES: >
    The trigger ID is 2-bits. It represents which detector was
    hit first. It can be 1, 2, 3 for detector A, B, C respectively.

default_tof: &default_tof
  <<: *default_uint16
  DEPEND_0: event_met
  FORMAT: I4
  UNITS: ticks
  VALIDMAX: 1023
  VAR_NOTES: >
    Time of flight is 10-bit integer value that represents the time of flight of
    the direct event. 1023 and 511 are values used to indicate no event was registered.

hi_de_tof_1:
  <<: *default_tof
  CATDESC: Time of flight of direct event, 1023 or 511 indicates no event registered
  FIELDNAM: Time of Flight (TOF) 1
  LABLAXIS: TOF1

hi_de_tof_2:
  <<: *default_tof
  CATDESC: Time of flight of direct event, 1023 or 511 indicates no event registered
  FIELDNAM: Time of Flight (TOF) 2
  LABLAXIS: TOF2

hi_de_tof_3:
  <<: *default_tof
  CATDESC: Time of flight of direct event, 1023 indicates no event registered
  FIELDNAM: Time of Flight (TOF) 3
  LABLAXIS: TOF3
  VAR_NOTES: >
    Time of flight is 10-bit integer value that represents the time of flight of
    the direct event. 1023 is the value used to indicate no event was registered.

hi_de_ccsds_index:
  <<: *default_uint16
  CATDESC: Zero-based index that associates an event with the packet it was encoded in.
  DEPEND_0: event_met
  FIELDNAM: Packet Index
  LABLAXIS: Packet Index

# ======= L1A HIST Section =======
# <=== Label Attributes ===>
# LABL_PTR_i expects VAR_TYPE of metadata with char data type
hi_hist_angle_label:
  CATDESC: Angle bin centers for histogram data.
  DEPEND_1: angle
  FIELDNAM: ANGLE
  FORMAT: A5
  VAR_TYPE: metadata

hi_hist_angle:
  CATDESC: Angle bin centers for histogram data.
  FIELDNAM: ANGLE
  FILLVAL: 65535
  FORMAT: I3
  LABLAXIS: ANGLE
  SCALE_TYPE: linear
  UNITS: deg
  VALIDMAX: 360
  VALIDMIN: 0
  VAR_TYPE: support_data
  dtype: uint16

hi_hist_version:
  <<: *default_ccsds_version

hi_hist_type:
  <<: *default_ccsds_type

hi_hist_sec_hdr_flg:
  <<: *default_ccsds_sec_hdr_flg

hi_hist_pkt_apid:
  <<: *default_ccsds_pkt_apid

hi_hist_seq_flgs:
  <<: *default_ccsds_seq_flgs

hi_hist_src_seq_ctr:
  <<: *default_ccsds_src_seq_ctr

hi_hist_pkt_len:
  <<: *default_ccsds_pkt_len

hi_hist_ccsds_met:
  <<: *hi_ccsds_met

hi_hist_esa_step:
  <<: *hi_esa_step

hi_hist_num_of_spins:
  <<: *default_uint8
  CATDESC: Number of spins included in histograms for this packet
  FIELDNAM: Number of spins
  LABLAXIS: Num spins

hi_hist_counters:
  <<: *default_uint16
  CATDESC: Angular histogram of {counter_name} type events
  DEPEND_1: angle
  FIELDNAM: "{counter_name} histogram"
  FORMAT: I4
  LABL_PTR_1: angle_label
  VALIDMAX: 4095

hi_hist_cksum:
  <<: *default_ccsds_cksum

# ======= L1B DE Section =======
hi_de_coincidence_type:
  <<: *default_uint8
  CATDESC: Bitmap of detectors hit for Direct Event
  DEPEND_0: event_met
  FIELDNAM: Coincidence Type
  FILLVAL: 0
  FORMAT: I2
  LABLAXIS: Type
  VALIDMAX: 15
  VALIDMIN: 0
  VAR_NOTES: >
    A 4-bit quantity, representable as a hexadecimal digit,
    made up of the ORed quantities: (A hit? 8:0) | (B hit? 4:0)
    | (C1 hit? 2:0) | (C2 hit? 1 : 0)

default_esa_energy_step: &default_esa_energy_step
  CATDESC: Zero based energy step index
  FIELDNAM: ESA energy step
  FILLVAL: 255
  FORMAT: I2
  VALIDMAX: 12
  VALIDMIN: 0

hi_de_esa_energy_step:
  <<: *default_uint8
  <<: *default_esa_energy_step
  LABLAXIS: Energy Step

default_l1b_tof: &default_l1b_tof
  <<: *default_int32
  DEPEND_0: event_met
  FORMAT: I3
  LABLAXIS: Time of Flight
  UNITS: ns
  VALIDMAX: 512
  VALIDMIN: -512

hi_de_tof_ab:
  <<: *default_l1b_tof
  CATDESC: Time difference between detector A and B events (t_B - t_A)
  FIELDNAM: ToF, event A to B

hi_de_tof_ac1:
  <<: *default_l1b_tof
  CATDESC: Time difference between detector A and C1 events (t_C1 - t_A)
  FIELDNAM: ToF, event A to C1

hi_de_tof_bc1:
  <<: *default_l1b_tof
  CATDESC: Time difference between detector B and C1 events (t_C1 - t_B)
  FIELDNAM: ToF, event B to C1

hi_de_tof_c1c2:
  <<: *default_l1b_tof
  CATDESC: Time difference between detector C1 and C2 events (t_C2 - t_C1)
  FIELDNAM: ToF, event C1 to C2

hi_de_spin_phase:
  <<: *default_float32
  CATDESC: Floating point spin phase
  DEPEND_0: event_met
  FIELDNAM: Spin Phase
  FORMAT: F4.3
  LABLAXIS: Spin Phase
  VALIDMAX: 1
  VALIDMIN: 0

hi_de_hae_latitude:
  <<: *default_float32
  CATDESC: Look direction HAE latitude
  DEPEND_0: event_met
  FIELDNAM: Ecliptic Latitude
  FORMAT: F5.2
  LABLAXIS: Lat
  UNITS: deg
  VALIDMAX: 180
  VALIDMIN: -180

hi_de_hae_longitude:
  <<: *default_float32
  CATDESC: Look direction HAE longitude
  DEPEND_0: event_met
  FIELDNAM: Ecliptic Longitude
  FORMAT: F5.2
  LABLAXIS: Lon
  UNITS: deg
  VALIDMAX: 360
  VALIDMIN: 0

hi_de_quality_flag:
  <<: *default_uint16
  CATDESC: Direct event bitwise quality flag
  DEPEND_0: event_met
  FIELDNAM: DE quality flag
  FILLVAL: 65535
  FORMAT: I5
  LABLAXIS: Qlt Flag
  VALIDMAX: 65535
  VALIDMIN: 0
  VAR_NOTES: >
    Bitwise quality flag {TODO: Store bitwise definition here?}

hi_de_nominal_bin:
  <<: *default_uint8
  CATDESC: Corresponding histogram angle bin for this Direct Event
  DEPEND_0: event_met
  FIELDNAM: Histogram Bin Number
  FORMAT: I2
  LABLAXIS: Hist Bin \#
  VALIDMAX: 89
  VALIDMIN: 0

hi_de_esa_step_met:
  <<: *default_float64
  CATDESC: Mission Elapsed Time (MET) in seconds of when the ESA was stepped
  FIELDNAM: ESA Start MET
  LABLAXIS: ESA Start MET
  UNITS: seconds
  VAR_TYPE: support_data

hi_de_ccsds_qf:
  <<: *default_uint8
  CATDESC: CCSDS packet quality flag bitmask
  FIELDNAM: CCSDS Quality Flag
  FORMAT: I3
  LABLAXIS: CCSDS QF
  VALIDMAX: 255
  VALIDMIN: 0
  VAR_NOTES: >
    Bitwise quality flag for CCSDS packet. Bit 0 (value 1): packet was full
    (contained 664 events). Bit 1 (value 2): ESA (inner/outer) voltage did not
    match any known esa_energy_step. Bit 2 (value 4): packet contained events
    from an invalid spin. Bit 3 (value 8): detector high voltage (CEM/MCP/U-Can/
    deflector) deviated from the pointing's own first-HVSCI-segment reference
    voltages (likely a gain test interval).

# ======= L1C PSET Section =======

# Define override values for epoch as defined in imap_constant_attrs.yaml
hi_pset_epoch:
  BIN_LOCATION: 0
  CATDESC: Start time of pointing, number of nanoseconds since J2000 with leap seconds included
  DELTA_PLUS_VAR: epoch_delta

hi_pset_epoch_delta:
  <<: *default_int64
  CATDESC: Number of nanoseconds in spacecraft pointing covered by this pointing set product
  DISPLAY_TYPE: no_plot
  FIELDNAM: epoch delta
  TIME_SCALE: Terrestrial Time
  UNITS: ns
  VAR_TYPE: support_data

hi_pset_esa_energy_step:
  <<: *default_esa_energy_step
  LABLAXIS: Energy Step
  MONOTON: INCREASE
  SCALETYP: linear
  UNITS: " "
  VALIDMAX: 12
  VALIDMIN: 0
  VAR_TYPE: support_data
  dtype: uint8

hi_pset_geometric_factor:
  <<: *default_float32
  CATDESC: >
    Geometric factor per calibration product and esa_energy_step for the detector
    gain configuration active during this pointing
  DEPEND_0: epoch
  DEPEND_1: esa_energy_step
  DEPEND_2: calibration_prod
  DISPLAY_TYPE: no_plot
  FIELDNAM: Geometric factor
  FORMAT: E12.5
  LABLAXIS: Geometric Factor
  LABL_PTR_1: esa_energy_step_label
  LABL_PTR_2: calibration_prod_label
  UNITS: cm^2 sr
  VALIDMAX: 1.0
  VALIDMIN: 0.0
  VAR_NOTES: >
    Geometric factor per esa_energy_step and calibration_prod, looked up from
    the cal-prod ancillary file's gain_config_id row matching the l1b_de's
    reference detector gain state.
  VAR_TYPE: support_data

hi_pset_calibration_prod:
  CATDESC: Coincidence types are combined into various calibration products
  FIELDNAM: Calibration product number
  FILLVAL: 65535
  FORMAT: I1
  LABLAXIS: Calibration Prod
  MONOTON: INCREASE
  SCALETYP: linear
  UNITS: " "
  VALIDMAX: 9
  VALIDMIN: 0
  VAR_TYPE: support_data
  dtype: uint8

hi_pset_spin_angle_bin:
  CATDESC: 0.1 degree spin angle bins
  FIELDNAM: Spin angle bin index
  FILLVAL: 65535
  FORMAT: I3
  LABLAXIS: Bin Index
  MONOTON: INCREASE
  SCALETYP: linear
  UNITS: " "
  VALIDMAX: 3599
  VALIDMIN: 0
  VAR_NOTES: >
    Bins are defined by spin angle about the mean axis of rotation for the pointing set.
    Spin angle bins start at closest to ecliptic North. Bin zero is centered at 0.05 degrees
    spinward of ecliptic North and all bins are 0.1 degrees wide.
  VAR_TYPE: support_data
  dtype: uint16

# Based on SPDF example of a vector magnetic field variable at the following link,
# despun_z does not need a DEPEND_1 because it does not depend on any support_data
# https://spdf.gsfc.nasa.gov/istp_guide/variables.html#data_eg2
hi_pset_despun_z:
  <<: *default_float32
  CATDESC: Unit vector corresponding to Despun Pointing Frame z-axis in HAE Ecliptic coordinates
  DISPLAY_TYPE: no_plot
  FIELDNAM: Despun Frame z-axis in HAE coordinates
  FORMAT: F5.3
  LABL_PTR_1: label_vector_HAE
  UNITS: " "
  VALIDMAX: 1
  VALIDMIN: -1
  VAR_TYPE: support_data

hi_pset_hae_latitude:
  <<: *default_float32
  CATDESC: Latitude of bin center in HAE coordinates
  DEPEND_0: epoch
  DEPEND_1: spin_angle_bin
  DISPLAY_TYPE: no_plot
  FIELDNAM: HAE Latitude
  FORMAT: F5.2
  LABLAXIS: Latitude
  UNITS: deg
  VALIDMAX: 180
  VALIDMIN: 0

hi_pset_hae_longitude:
  <<: *default_float32
  CATDESC: Longitude of bin center in HAE coordinates
  DEPEND_0: epoch
  DEPEND_1: spin_angle_bin
  DISPLAY_TYPE: no_plot
  FIELDNAM: HAE Longitude
  FORMAT: F5.2
  LABLAXIS: Latitude
  UNITS: deg
  VALIDMAX: 360
  VALIDMIN: 0

hi_pset_counts:
  <<: *default_uint16
  CATDESC: Binned direct events counts during good times
  DEPEND_0: epoch
  DEPEND_1: esa_energy_step
  DEPEND_2: calibration_prod
  DEPEND_3: spin_angle_bin
  DISPLAY_TYPE: stack_plot
  FIELDNAM: Binned DE counts
  FORMAT: I5
  LABL_PTR_1: esa_energy_step_label
  LABL_PTR_2: calibration_prod_label
  LABL_PTR_3: spin_bin_label

hi_pset_exposure_times:
  <<: *default_float32
  CATDESC: Exposure times for each bin during good times
  DEPEND_0: epoch
  DEPEND_1: esa_energy_step
  DEPEND_2: spin_angle_bin
  DISPLAY_TYPE: stack_plot
  FIELDNAM: Bin exposure times
  FORMAT: F6.2
  LABL_PTR_1: esa_energy_step_label
  LABL_PTR_2: spin_bin_label
  UNITS: sec

hi_pset_background_rates:
  <<: *default_float32
  CATDESC: Background count rates
  DEPEND_0: epoch
  DEPEND_1: esa_energy_step
  DEPEND_2: calibration_prod
  DEPEND_3: spin_angle_bin
  DISPLAY_TYPE: stack_plot
  FIELDNAM: Background count rates
  FORMAT: F4.2
  LABL_PTR_1: esa_energy_step_label
  LABL_PTR_2: calibration_prod_label
  LABL_PTR_3: spin_bin_label
  UNITS: counts / s

hi_pset_background_rates_uncertainty:
  <<: *default_float32
  CATDESC: Background count rate uncertainties
  DEPEND_0: epoch
  DEPEND_1: esa_energy_step
  DEPEND_2: calibration_prod
  DEPEND_3: spin_angle_bin
  DISPLAY_TYPE: stack_plot
  FIELDNAM: Background count rate uncertainties
  FORMAT: F4.2
  LABL_PTR_1: esa_energy_step_label
  LABL_PTR_2: calibration_prod_label
  LABL_PTR_3: spin_bin_label
  UNITS: counts / s

# <=== pset label Attributes ===>
hi_pset_spin_bin_label:
  CATDESC: Label spin angle bin
  DEPEND_1: spin_angle_bin
  FIELDNAM: Label spin angle bin
  FORMAT: A4
  VAR_TYPE: metadata

hi_pset_esa_energy_step_label:
  CATDESC: Label esa step
  DEPEND_1: esa_energy_step
  FIELDNAM: Label esa step
  FORMAT: A4
  VAR_TYPE: metadata

hi_pset_calibration_prod_label:
  CATDESC: Label calibration product
  DEPEND_1: calibration_prod
  FIELDNAM: Label calibration product
  FORMAT: A4
  VAR_TYPE: metadata

hi_pset_label_vector_HAE:
  CATDESC: Label cartesian despun_z
  FIELDNAM: Label cartesian despun_z
  FORMAT: A5
  VAR_TYPE: metadata

# <=== L1B Goodtimes Attributes ===>
hi_goodtimes_met:
  <<: *default_float64
  CATDESC: Mission Elapsed Time for each 8-spin histogram packet
  DEPEND_0: epoch
  FIELDNAM: MET
  LABLAXIS: MET
  UNITS: s
  VALIDMAX: 1.7976931348623157e+308
  VALIDMIN: 0
  VAR_TYPE: support_data

hi_goodtimes_cull_flags:
  <<: *default_uint8
  CATDESC: Cull flags indicating good (0) or bad (non-zero) times per spin bin
  DEPEND_0: epoch
  DEPEND_1: spin_bin
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Cull Flags
  LABLAXIS: Cull Code
  LABL_PTR_1: spin_bin_label
  UNITS: " "
  VAR_NOTES: >
    Cull flags array with dimensions (epoch, spin_bin). Value of 0 indicates good time,
    non-zero values indicate bad times with specific cull reason codes.
    Cull code 1 (LOOSE) indicates times removed by quality filters.

hi_goodtimes_esa_step:
  <<: *default_uint8
  CATDESC: ESA energy step for each 8-spin histogram packet
  DEPEND_0: epoch
  FIELDNAM: ESA Step
  LABLAXIS: ESA Step
  UNITS: " "
  VALIDMAX: 10
  VALIDMIN: 1
  VAR_TYPE: support_data

hi_goodtimes_spin_bin:
  CATDESC: Spin angle bin index
  FIELDNAM: Spin Bin
  FILLVAL: 255
  FORMAT: I2
  LABLAXIS: Spin Bin
  UNITS: " "
  VALIDMAX: 89
  VALIDMIN: 0
  VAR_NOTES: >
    Spin angle bins numbered 0-89, covering 0-360 degrees of spacecraft spin.
    Each bin is 4 degrees wide.
  VAR_TYPE: support_data
  dtype: uint8

hi_goodtimes_spin_bin_label:
  CATDESC: Label for spin bin
  DEPEND_0: spin_bin
  FIELDNAM: Spin Bin Label
  FORMAT: A3
  VAR_TYPE: metadata
