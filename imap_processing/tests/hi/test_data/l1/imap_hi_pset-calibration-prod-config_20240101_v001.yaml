# YAML Definition of how to filter direct events into calibration product categories
# This definition should contain a list of time varying configuration definitions at
# the root level of the YAML. For readability, the list should be ordered by the specified
# `valid_date`. Each definition must contain a "description", "valid_date",
# and "product_list" entry.
#
# Description of a single product definition:
# -------------------------------------------
#   description : string describing the source of the entry
#   valid_date : UTC time string indicating the date after which the configuration is valid.
#   product_list : list of calibration product definitions
#     Required calibration product definition fields:
#     index : integer, calibration product index number. This must match the zero based index of
#         definition location within the product list.
#     coincidence_type_bin_strings : list of binary strings indicating DE coincidence types to
#         include. Examples are "1111" = ABC1C2, "1010" = AC1
#     tof_ab_range : list of acceptable AB TOF ranges for ESA energy steps 1-9
#     tof_ac1_range : list of acceptable AC1 TOF ranges for ESA energy steps 1-9
#     tof_bc1_range : list of acceptable BC1 TOF ranges for ESA energy steps 1-9
#     tof_c1c2_range : list of acceptable C1C2 TOF ranges for ESA energy steps 1-9

- description: "Pre-launch configuration"
  valid_date: "2024-01-10T00:00:00"
  product_list:
    - index: 0
      coincidence_type_bin_strings: ["1111", "1110", "1011"]
      tof_ab_range:  [ [ 15, 55 ],  [ 15, 55 ],  [ 15, 55 ],  [ 15, 55 ],  [ 15, 55 ],  [ 15, 55 ],  [ 15, 55 ],  [ 15, 55 ],  [ 15, 55 ] ]
      tof_ac1_range: [ [ 0, 70 ],   [ 0, 70 ],   [ 0, 70 ],   [ 0, 70 ],   [ 0, 70 ],   [ 0, 70 ],   [ 0, 70 ],   [ 0, 70 ],   [ 0, 70 ] ]
      tof_bc1_range: [ [ -50, 10 ], [ -50, 10 ], [ -50, 10 ], [ -50, 10 ], [ -50, 10 ], [ -50, 10 ], [ -50, 10 ], [ -50, 10 ], [ -50, 10 ] ]
      tof_c1c2_range: [ [ 5, 25 ],  [ 5, 25 ],   [ 5, 25 ],   [ 5, 25 ],   [ 5, 25 ],   [ 5, 25 ],   [ 5, 25 ],   [ 5, 25 ],   [ 5, 25 ] ]
    - index: 1
      coincidence_type_bin_strings: [ "0111", "1100", "1010"]
      tof_ab_range:  [ [ 15, 55 ],  [ 15, 55 ],  [ 15, 55 ],  [ 15, 55 ],  [ 15, 55 ],  [ 15, 55 ],  [ 15, 55 ],  [ 15, 55 ],  [ 15, 55 ] ]
      tof_ac1_range: [ [ 0, 70 ],   [ 0, 70 ],   [ 0, 70 ],   [ 0, 70 ],   [ 0, 70 ],   [ 0, 70 ],   [ 0, 70 ],   [ 0, 70 ],   [ 0, 70 ] ]
      tof_bc1_range: [ [ -50, 10 ], [ -50, 10 ], [ -50, 10 ], [ -50, 10 ], [ -50, 10 ], [ -50, 10 ], [ -50, 10 ], [ -50, 10 ], [ -50, 10 ] ]
      tof_c1c2_range: [ [ 5, 25 ],  [ 5, 25 ],   [ 5, 25 ],   [ 5, 25 ],   [ 5, 25 ],   [ 5, 25 ],   [ 5, 25 ],   [ 5, 25 ],   [ 5, 25 ] ]