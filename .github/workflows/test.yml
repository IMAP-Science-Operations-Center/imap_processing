name: Tests

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    defaults:
      run:
        shell: bash


    steps:
      - uses: actions/checkout@v4
        with:
          # We need the full history to generate the proper version number
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Gr1N/setup-poetry@v9
        with:
          poetry-version: "2.3.4"


      - name: Install dependencies and app
        run: |
          # Need to install extra plugins first
          poetry self add "poetry-dynamic-versioning[plugin]"
          poetry install --extras "test"

      - name: Cache data directories
        uses: actions/cache@v4
        # We only download data on this runner, so only cache data from this run
        # so we don't get an empty cache on other runners overriding that data
        if: ${{ contains(matrix.os, 'ubuntu') && matrix.python-version == '3.10' }}
        with:
          path: |
            **/data/
            **/test_data/
          key: cdf-data-${{ hashFiles('**/data/*', '**/test_data/*') }}
          restore-keys: |
            cdf-data-

      - name: Testing
        id: test
        env:
          USE_EXTERNAL_DATA: ${{ contains(matrix.os, 'ubuntu') && matrix.python-version == '3.10' }}
        run: |
          # Ignore the network marks from the remote test environment
          if [ "$USE_EXTERNAL_DATA" = "true" ]; then
            # Download external data before we run our tests so that
            # we don't try to download them in parallel
            poetry run python imap_processing/tests/conftest.py
            poetry run pytest -vvv -n auto --color=yes --cov --cov-report=xml --log-disable=root
          else
            poetry run pytest -vvv -n auto --color=yes --cov --cov-report=xml  --log-disable=root -m "not external_kernel and not external_test_data"
          fi

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  pandas-3-compatibility:
    name: Pandas 3 compatibility (Python ${{ matrix.python-version }})
    # This is an advisory compatibility check and must not block pull requests.
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      # Run both supported Python versions even if one compatibility job fails.
      fail-fast: false
      matrix:
        # The first Python version below is the oldest version with Pandas 3
        # support that is also supported by IMAP, while the second is the
        # newest Python version supported by IMAP.
        python-version: ['3.11', '3.12']
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          # We need the full history to generate the proper version number.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Gr1N/setup-poetry@v9
        with:
          poetry-version: "2.3.4"

      - name: Install dependencies, app, and Pandas 3
        run: |
          poetry self add "poetry-dynamic-versioning[plugin]"
          poetry install --extras "test"
          poetry run python -m pip install "pandas>=3,<4"
          poetry run python -c "import pandas; print(f'Pandas {pandas.__version__}')"

      # Run tests without external data.
      - name: Test with Pandas 3
        run: |
          # Coverage is produced and uploaded by the blocking primary matrix. Do
          # not upload duplicate advisory results or affect the coverage report.
          poetry run pytest -vvv -n auto --color=yes --log-disable=root \
            -m "not external_kernel and not external_test_data"
